name: Build and Publish XrmToolBox Plugin

on:
  push:
    branches:
      - main  # Trigger on pushes to the main branch
  workflow_dispatch: # Allows manual triggering

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore YourProject.sln

    - name: Build the solution
      run: msbuild YourProject.sln /p:Configuration=Release

    - name: Pack NuGet package
      run: |
        nuget pack YourProject.nuspec -Properties Configuration=Release -OutputDirectory ./nuget-output

    - name: Publish to NuGet
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: |
        nuget push ./nuget-output/*.nupkg -Source https://api.nuget.org/v3/index.json -ApiKey $NUGET_API_KEY
