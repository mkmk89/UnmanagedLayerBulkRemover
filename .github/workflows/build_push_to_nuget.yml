name: Build and Publish XrmToolBox Plugin

on:
  push:
    branches:
      - master
  workflow_dispatch: # Allows manual triggering

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore UnmanagedLayerBulkRemover.sln
    
    - name: Install Visual Studio Build Tools
      # Ensures MSBuild and .NET Framework tools are available
      run: |
        choco install visualstudio2022buildtools --params "--add Microsoft.VisualStudio.Workload.ManagedDesktopBuildTools --includeRecommended --includeOptional"
        refreshenv

    - name: Build the solution
      run: msbuild UnmanagedLayerBulkRemover.sln /p:Configuration=Release

    - name: Pack NuGet package
      run: |
        nuget pack UnmanagedLayerBulkRemover/UnmanagedLayerBulkRemover.nuspec.nuspec -Properties Configuration=Release -OutputDirectory ./nuget-output

    - name: Publish to NuGet
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: |
        nuget push ./nuget-output/*.nupkg -Source https://api.nuget.org/v3/index.json -ApiKey $NUGET_API_KEY
