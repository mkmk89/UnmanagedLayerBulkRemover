name: Build and Publish XrmToolBox Plugin

on:
  push:
    branches:
      - master
  workflow_dispatch: # Allows manual triggering

jobs:
  build:
    runs-on: windows-2019

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2
      
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2
  
    - name: Restore NuGet packages
      run: nuget restore UnmanagedLayerBulkRemover.sln
  
    - name: Build the solution
      run: msbuild UnmanagedLayerBulkRemover.sln /p:Configuration=Release

    - name: Pack NuGet package
      run: |
        nuget pack UnmanagedLayerBulkRemover/UnmanagedLayerBulkRemover.nuspec -Properties Configuration=Release -OutputDirectory ./nuget-output

    - name: Publish to NuGet
      run: |
        nuget push ./nuget-output/*.nupkg -Source https://api.nuget.org/v3/index.json -ApiKey ${{ secrets.NUGET_API_KEY }}
