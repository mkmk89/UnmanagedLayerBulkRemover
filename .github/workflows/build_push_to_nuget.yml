name: Build and Publish XrmToolBox Plugin

on:
  push:
    branches:
      - master
  workflow_dispatch: # Allows manual triggering

jobs:
  build:
    runs-on: windows-2019

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2
      
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2
  
    - name: Restore NuGet packages
      run: nuget restore UnmanagedLayerBulkRemover.sln
  
    - name: Build the solution
      run: msbuild UnmanagedLayerBulkRemover.sln /p:Configuration=Release
    
    - name: Set version
      id: set_version
      run: |
        # Use the GitHub run number for incremental versioning
        $VERSION_DATE = Get-Date -Format "yyyy.MM.dd"
        $INCREMENTAL_BUILD_NUMBER = $env:GITHUB_RUN_NUMBER
    
        # Set the full version as date-based with incremental build number
        $PACKAGE_VERSION = "$VERSION_DATE.$INCREMENTAL_BUILD_NUMBER"
        
        Write-Host "Package version: $PACKAGE_VERSION"
    
        # Set the version to an environment variable for later steps
        echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $env:GITHUB_ENV

    - name: Pack NuGet package
      run: |
        nuget pack UnmanagedLayerBulkRemover/UnmanagedLayerBulkRemover.nuspec -Properties Configuration=Release -Version ${{ env.PACKAGE_VERSION }} -OutputDirectory ./nuget-output

    - name: List files in nuget-output
      run: dir ./nuget-output

    - name: Publish to NuGet
      run: |
        # Ensure the .nupkg file is correctly referenced
        nuget push ./nuget-output/UnmanagedLayerBulkRemover.${{ env.PACKAGE_VERSION }}.nupkg -Source https://api.nuget.org/v3/index.json -ApiKey ${{ secrets.NUGET_API_KEY }}
